name: Deploy OAuth Proxy (Cloudflare Worker)

on:
  push:
    branches:
      - main
    paths:
      - "oauth-proxy/**"
      - ".github/workflows/deploy-oauth-proxy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: oauth-proxy
          command: deploy

      - name: Set Worker secrets
        working-directory: oauth-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OAUTH_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GITHUB_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
        run: |
          npx wrangler secret put GITHUB_CLIENT_ID <<< "$OAUTH_CLIENT_ID"
          npx wrangler secret put GITHUB_CLIENT_SECRET <<< "$OAUTH_CLIENT_SECRET"
